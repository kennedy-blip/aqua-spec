<!doctype html>
<html lang="en" data-theme="abyssal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#030914" />
    <meta
      name="description"
      content="AQUA-SPECTRA — a polyglot water-quality instrument: AssemblyScript WASM nephelometry, CIEDE2000 strip colorimetry, Elixir Langelier corrosion auditing, Datalog hazard inference, GLSL caustics, and offline survival purification."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>AQUA-SPECTRA · Polyglot Hydro-Optical Water Laboratory</title>

    <style>
      /* Critical shell styles — paint the abyss before the module graph parses. */
      :root {
        --shell-bg: #030914;
        --shell-ink: #e8f6ff;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(60% 50% at 50% 40%, #072336, #030914 76%);
        background-attachment: fixed;
        color: var(--shell-ink);
        font-family: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 20px;
        text-align: center;
        transition: opacity 0.5s ease;
        z-index: 1;
      }
      #splash .ring {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        border: 2px solid rgba(6, 182, 212, 0.22);
        border-top-color: #06b6d4;
        animation: spin 0.9s linear infinite;
      }
      #splash p {
        margin: 0;
        font-size: 10.5px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #4c7d94;
        font-family: ui-monospace, 'SF Mono', monospace;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      aqua-app {
        display: block;
        opacity: 0;
        transition: opacity 0.45s ease 0.1s;
      }
      aqua-app.hydrated {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="ring"></div>
      <p>aqua-spectra · linking polyglot runtime</p>
    </div>
    <aqua-app></aqua-app>
    <noscript>
      <div style="padding: 40px; font-family: system-ui; max-width: 640px; margin: 0 auto">
        <h1>AQUA-SPECTRA needs JavaScript</h1>
        <p>
          The optical nephelometer, CIEDE2000 colorimeter, Langelier corrosion lab and acoustic flow gauge all run
          entirely on-device. Enable JavaScript to operate the instrument — no water sample data ever leaves your phone.
        </p>
      </div>
    </noscript>
  </body>
</html>
