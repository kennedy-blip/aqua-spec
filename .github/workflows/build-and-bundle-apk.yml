name: Build Android and web bundle
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/13ab9d29-aqua-spec"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run build:wasm
      - run: npm run build:apk
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose public/releases/aquaspectra-release.apk
          unzip -l public/releases/aquaspectra-release.apk | grep classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: AquaSpectra-HydroLab-v1.0.0
          path: |
            public/releases/
            dist/
          retention-days: 30
